# Include inside the existing vps.mosha.net <VirtualHost *:443>.
RedirectMatch 308 ^/ps2mud$ /ps2mud/

ProxyPass /ps2mud/api/game ws://127.0.0.1:8080/api/game
ProxyPassReverse /ps2mud/api/game ws://127.0.0.1:8080/api/game
ProxyPass /ps2mud/api/ http://127.0.0.1:8080/api/
ProxyPassReverse /ps2mud/api/ http://127.0.0.1:8080/api/

Alias /ps2mud/ /home/chatgpt/ps2mud/site/
<Directory /home/chatgpt/ps2mud/site>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
